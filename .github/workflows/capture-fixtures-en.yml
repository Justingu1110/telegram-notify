name: Capture Marukyu English fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-fixtures-en
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture pages
        run: bash scripts/capture_marukyu_en_fixtures.sh

      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/marukyu_en
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Capture raw Marukyu-Koyamaen English pages as test fixtures"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
